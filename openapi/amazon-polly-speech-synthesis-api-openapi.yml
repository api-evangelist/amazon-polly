security:
- hmac: []
tags:
- name: Speech Synthesis
  description: Operations for synthesizing speech from text
paths:
  /v1/speech:
    post:
      operationId: SynthesizeSpeech
      summary: Amazon Polly Synthesize Speech
      description: Synthesizes UTF-8 input text into an audio stream.
      tags:
      - Speech Synthesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SynthesizeSpeechInput'
      responses:
        '200':
          description: Speech audio stream
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
components:
  schemas:
    SynthesizeSpeechInput:
      type: object
      required:
      - OutputFormat
      - Text
      - VoiceId
      properties:
        Engine:
          type: string
          enum:
          - standard
          - neural
          - long-form
          - generative
          description: The engine to use for speech synthesis
        LanguageCode:
          type: string
          description: Language code for the synthesis request
        LexiconNames:
          type: array
          items:
            type: string
          description: List of lexicon names to apply during synthesis
        OutputFormat:
          type: string
          enum:
          - json
          - mp3
          - ogg_vorbis
          - pcm
          description: The format in which the returned output will be encoded
        SampleRate:
          type: string
          description: The audio frequency in Hz
        SpeechMarkTypes:
          type: array
          items:
            type: string
            enum:
            - sentence
            - ssml
            - viseme
            - word
        Text:
          type: string
          description: Input text to synthesize
        TextType:
          type: string
          enum:
          - ssml
          - text
          description: Whether the input text is plain text or SSML
        VoiceId:
          type: string
          description: Voice ID to use for the synthesis
  securitySchemes:
    hmac:
      type: apiKey
      name: Authorization
      in: header
      description: Amazon Signature authorization v4
      x-amazon-apigateway-authtype: awsSigv4
externalDocs:
  description: Amazon Web Services documentation
  url: https://docs.aws.amazon.com/polly/
